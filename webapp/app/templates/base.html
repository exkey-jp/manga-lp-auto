<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}漫画LP 自動制作{% endblock %}</title>
{% block head %}{% endblock %}
<style>
:root{--ink:#1c232d;--sub:#5b6573;--line:#d9dee6;--bg:#f4f6f9;--paper:#fff;--accent:#1d4ed8;--ok:#15803d;--ng:#b91c1c;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header a{color:var(--ink);text-decoration:none;font-weight:700}
header small{color:var(--sub);font-weight:400}
main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 12px} h2{font-size:18px;margin:28px 0 10px} h3{font-size:15px;margin:16px 0 6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn.sub{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.ok{background:var(--ok)}
label{display:block;font-weight:700;margin:12px 0 4px}
label small{font-weight:400;color:var(--sub)}
input[type=text],input[type=password],input[type=url],input[type=number],textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:90px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 16px}
table{border-collapse:collapse;width:100%;font-size:13.5px} th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:#e5e7eb}
.tag.running,.tag.queued{background:#dbeafe;color:#1e40af}.tag.waiting{background:#fef3c7;color:#92400e}.tag.done{background:#dcfce7;color:#166534}.tag.failed{background:#fee2e2;color:#991b1b}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.steps li{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:#fff;color:var(--sub)}
.steps li.now{border-color:var(--accent);color:var(--accent);font-weight:700}.steps li.past{color:var(--ok)}
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.panel img{display:block;width:100%;height:150px;object-fit:contain;background:#eef1f5}
.panel .b{padding:8px 10px}
.panel.ask_human{border:2px solid var(--warn)}
.muted{color:var(--sub);font-size:13px}
.err{color:var(--ng);font-weight:700}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;max-height:260px;overflow:auto;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px}
pre.md{white-space:pre-wrap;font-family:inherit;font-size:13.5px;max-height:480px;overflow:auto;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px}
.notice{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.screens{display:flex;gap:10px;overflow-x:auto}.screens img{height:420px;border:1px solid var(--line);border-radius:6px}
</style>
</head>
<body>
<header><a href="/">漫画LP 自動制作 {% if mock %}<small>（仮の動作モード）</small>{% endif %}</a>{% if user %}<span class="muted">{{ user }}　<a href="/logout" class="muted">ログアウト</a></span>{% endif %}</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
