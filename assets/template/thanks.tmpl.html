<!doctype html>
<html lang="ja">
<head>
{{GTM_HEAD}}<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{THANKS_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
{{THANKS_TOKENS}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.75}
img{display:block;max-width:100%;height:auto}
.page{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;padding:0 0 40px}
.hdr{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:900;color:var(--navy)}
.hdr small{display:block;font-size:9.5px;font-weight:500;color:var(--sub);line-height:1.2}
.sec{padding:24px 18px;display:grid;gap:14px;text-align:center}
h1{margin:0;font-size:24px;font-weight:900;line-height:1.4}
.lead{margin:0;font-size:14px;color:var(--sub)}
.box{border:3px solid var(--cta);border-radius:16px;padding:16px 12px;display:grid;gap:4px;background:#fffaf4}
.box .lb{justify-self:center;font-size:13px;font-weight:900;color:#fff;background:var(--cta);border-radius:999px;padding:2px 16px}
.box .amt{font-size:15px;font-weight:700}
.box .amt b{font-size:46px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums;line-height:1.2}
.box .yr{font-size:15px;font-weight:700}
.box .yr b{background:linear-gradient(transparent 60%,var(--mark) 60%);font-size:19px}
.pair{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;text-align:left}
.pair p{margin:0;font-weight:700;font-size:14px}
.fine{margin:0;font-size:11px;color:var(--sub);text-align:left;line-height:1.6}
.notarget{border:2px solid var(--red);border-radius:12px;padding:12px;text-align:left;font-size:14px;background:#fff5f5}
.phone{border:2px solid var(--cta);border-radius:12px;background:var(--gift-bg);padding:14px;font-size:15px;font-weight:700;line-height:1.8}
.plan{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;background:var(--soft)}
.plan h2{margin:0 0 6px;font-size:16px;font-weight:900;color:var(--navy)}
.plan ul{margin:0;padding-left:1.2em}
.steps{display:grid;text-align:left;counter-reset:s}
.steps div{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;font-size:14px;font-weight:700;padding-block:6px}
.steps div::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px}
.trust{display:flex;justify-content:center;gap:14px;font-size:12px;font-weight:700;color:var(--navy)}
.btn{display:block;text-align:center;background:var(--cta);color:#fff;border-radius:999px;padding:14px;font-weight:900;text-decoration:none}
</style>
</head>
<body>
{{GTM_BODY}}<div class="page">
  <div class="hdr">{{SITE_NAME}}<small>{{TAGLINE}}</small></div>
  <main id="out" class="sec"></main>
</div>
<script>
{{THANKS_JS}}
</script>
</body>
</html>
